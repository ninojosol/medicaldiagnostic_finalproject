# ===========================================================================
# Chest X-ray classification - TRANSFER LEARNING (pretrained DenseNet-121)
#
# Keep `data:` IDENTICAL to xray_baseline.yaml so the comparison between the two
# models is fair - same images, same split, same labels, same input size. Only
# the model and the optimisation settings differ.
#
# This file mirrors stage 2 of the reported run
# `xray_finetuned_densenet_multilabel_320` (stage 1 is the same file with
# model.freeze_backbone: true, epochs: 5, early_stopping_patience: 2).
#
# AUTHORITATIVE RECORD: the exact configuration of any completed run is the
# snapshot written next to its artifacts:
#   outputs/classification/<run_name>/config_used.yaml
# The reproducibility script scripts/run_xray_finetune_densenet.py loads those
# snapshots, not this file. Edit this file to launch a NEW experiment.
#
# First run downloads ImageNet weights (~30 MB) and needs internet.
# ===========================================================================
inherits: base.yaml

run_name: xray_finetuned_densenet_multilabel_320

data:
  root: data/raw/xray/nih
  layout: csv

  csv_path: data/processed/xray/train_clean.csv
  image_root: data/raw/xray/nih/images-small
  image_column: Image
  patient_column: PatientId

  # Frozen NIH-14 order - shared with xray_baseline.yaml and every artifact.
  labels:
    - Atelectasis
    - Cardiomegaly
    - Consolidation
    - Edema
    - Effusion
    - Emphysema
    - Fibrosis
    - Hernia
    - Infiltration
    - Mass
    - Nodule
    - Pleural_Thickening
    - Pneumonia
    - Pneumothorax

  unlisted_folders_as_negative: true
  patient_id_regex: null

  image_size: 320
  val_size: 0.15
  test_size: 0.15
  use_official_split: true

model:
  name: densenet121       # efficientnet_b0 is the second transfer model (see run_xray_finetune_efficientnet_b0.py)
  pretrained: true        # ImageNet weights; also selects ImageNet mean/std normalization
  # Stage 2 of the two-stage schedule: the whole network is trainable, starting
  # from the stage-1 (head-only) checkpoint. Set true for a stage-1 config.
  freeze_backbone: false
  dropout: 0.2

augmentation:
  # Zero magnitudes: preprocessing is identical for train, validation and
  # inference in the reported runs.
  hflip: 0.0
  rotation_degrees: 0.0
  translate: 0.0
  scale: [1.0, 1.0]
  brightness: 0.0
  contrast: 0.0
  random_erasing: 0.0

train:
  epochs: 10              # stopped early at epoch 6 in the reported run
  batch_size: 32          # lower to 16 if you hit CUDA out-of-memory
  lr: 0.0001              # smaller than the baseline: fine-tuning, not learning from zero
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: plateau
  scheduler_patience: 2
  loss: weighted_bce
  use_class_weights: true
  monitor: val_roc_auc
  early_stopping_patience: 3

eval:
  threshold_strategy: f1
  min_recall: 0.80
  n_bootstrap: 1000       # test-set CIs only; unused in validation-only runs

gradcam:
  # Which label's Grad-CAM to visualise (index into data.labels).
  class_index: 0
  examples_per_group: 2   # TP / TN / FP / FN examples per panel
  alpha: 0.4

output:
  root: outputs/classification
