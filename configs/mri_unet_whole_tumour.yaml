# ===========================================================================
# MRI brain-tumour segmentation — binary WHOLE TUMOUR vs background
#
# Model: 2D slice-wise U-Net using four MRI sequences.
#        4 input channels (FLAIR, T1w, T1gd, T2w), 1 binary output channel.
#        This is NOT a 3D U-Net.
#
# Isolated from every other config in this repo. Nothing here is shared with
# the X-ray classification workstream or with the legacy configs/mri_unet.yaml
# (which targets a different, PNG/TIFF-based dataset and is left untouched).
# ===========================================================================

run_name: mri_unet_whole_tumour_2d

seed: 42
deterministic: true
device: auto

# --- dataset ---------------------------------------------------------------
data:
  source_dataset: decathlon_task01_brain_tumour
  source_name: "Medical Segmentation Decathlon — Task01_BrainTumour (BraTS)"
  source_url: "https://msd-for-monai.s3-us-west-2.amazonaws.com/Task01_BrainTumour.tar"
  licence: "CC BY-SA 4.0 (Medical Segmentation Decathlon)"

  raw_dir: data/raw/mri/decathlon_task01_brain_tumour
  manifest_dir: data/processed/mri

  # Source label mapping, verbatim from the shipped dataset.json (including the
  # source's own inconsistent spelling: "tumor" for 2, "tumour" for 3).
  source_labels:
    0: background
    1: edema
    2: non-enhancing tumor
    3: enhancing tumour

  # Project target: binary whole tumour. Every non-background label is merged.
  target: whole_tumour_binary
  binary_rule: "mask = (label > 0)"
  tumour_source_labels: [1, 2, 3]

  modalities: [FLAIR, T1w, T1gd, T2w]
  slice_axis: 2                 # axial axis of the 240x240x155 volume

# --- preprocessing ---------------------------------------------------------
preprocess:
  # Chosen after the GPU-memory smoke test in scripts/mri_gpu_smoke_test.py.
  # Recorded in run_metadata.json alongside the measured VRAM figures.
  input_size: 192
  normalization: nonzero_zscore_per_modality
  image_interpolation: bilinear   # image only
  mask_interpolation: nearest     # masks only — never interpolate labels
  min_brain_fraction: 0.02

# --- slice retention (train only; valid/test keep every slice) -------------
slices:
  keep_all_tumour_slices: true
  empty_slice_ratio: 0.35       # deterministic per-case sample of empty brain slices
  sampling_seed: 42

# --- split (frozen; see data/processed/mri/split_summary.json) -------------
split:
  unit: patient
  seed: 42
  train: 0.70
  valid: 0.15
  test: 0.15
  stratify_on_tumour_burden: true
  test_is_protected: true
  test_note: >-
    Project-created internal held-out test split drawn from the same public
    Decathlon training archive. Not an external or clinical test set.

# --- model -----------------------------------------------------------------
model:
  name: mri_unet_2d
  label: "2D slice-wise U-Net using four MRI sequences"
  in_channels: 4
  out_channels: 1               # single binary logit channel
  features: [32, 64, 128, 256]
  bottleneck: 512
  dropout: 0.0
  output: logits                # sigmoid applied only for metrics/inference

# --- training --------------------------------------------------------------
train:
  epochs: 30
  batch_size: 24
  lr: 0.0003
  weight_decay: 0.00001
  optimizer: adamw
  amp: true
  grad_clip: 1.0
  num_workers: 4

  # L = bce_weight * BCEWithLogits + dice_weight * (1 - SoftDice)
  loss: dice_bce
  bce_weight: 0.5
  dice_weight: 0.5
  dice_smooth: 1.0
  pos_weight: null

  scheduler: reduce_on_plateau
  scheduler_patience: 3
  scheduler_factor: 0.5
  min_lr: 0.000001

  # Selection/stopping use VALIDATION Dice only. The test split is never read.
  selection_metric: validation_micro_dice
  early_stopping_patience: 7

# --- evaluation ------------------------------------------------------------
eval:
  # Fixed at 0.5. Deliberately NOT tuned — tuning a threshold on validation and
  # then reporting held-out test at that threshold is fine, but a fixed 0.5 keeps
  # the story simple and is stated as-is in the report.
  threshold: 0.5
  batch_size: 32
  n_bootstrap: 2000
  n_validation_overlays: 8
  n_test_overlays: 6
  save_case_predictions: true

# --- output ----------------------------------------------------------------
output:
  root: outputs/segmentation
  # Final directory is <root>/mri_unet_whole_tumour_2d_<input_size>/
