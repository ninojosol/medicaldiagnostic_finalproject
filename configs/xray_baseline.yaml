# ===========================================================================
# Chest X-ray classification - BASELINE (simple CNN trained from scratch)
#
# Purpose: an honest reference point. Whatever the transfer-learning model
# scores only means something relative to this.
#
# This file mirrors the settings of the reported run
# `xray_baseline_cnn_from_scratch_multilabel_320`.
#
# AUTHORITATIVE RECORD: the exact configuration of any completed run is the
# snapshot written next to its artifacts:
#   outputs/classification/<run_name>/config_used.yaml
# The reproducibility script scripts/run_xray_baseline_cnn.py loads that
# snapshot, not this file. Edit this file to launch a NEW experiment.
# ===========================================================================
inherits: base.yaml

run_name: xray_baseline_cnn_from_scratch_multilabel_320

data:
  # --- where the images are ------------------------------------------------
  root: data/raw/xray/nih

  # --- how the dataset is organised ---------------------------------------
  # csv: manifest CSVs list the images and one binary column per finding.
  # This project is multi-label, so `folders` layout is not applicable.
  layout: csv

  # Manifest built by notebook 01 (deduplicated, patient-level split).
  # The scripts pass train_clean.csv + valid_clean.csv through
  # make_manifest(); the official test.csv is deliberately NOT referenced.
  csv_path: data/processed/xray/train_clean.csv
  image_root: data/raw/xray/nih/images-small
  image_column: Image
  patient_column: PatientId

  # --- the 14 NIH ChestX-ray findings, one sigmoid output per label -------
  # This order is frozen: it is the order used by every checkpoint, threshold
  # file, metrics CSV and the Streamlit app. Do not reorder.
  labels:
    - Atelectasis
    - Cardiomegaly
    - Consolidation
    - Edema
    - Effusion
    - Emphysema
    - Fibrosis
    - Hernia
    - Infiltration
    - Mass
    - Nodule
    - Pleural_Thickening
    - Pneumonia
    - Pneumothorax

  unlisted_folders_as_negative: true

  # Patient IDs come from the manifest's PatientId column, so no regex is
  # needed to recover them from filenames.
  patient_id_regex: null

  image_size: 320
  val_size: 0.15
  test_size: 0.15
  # The split is pre-computed by notebook 01 with GroupShuffleSplit over
  # PatientId; the training scripts consume it as-is.
  use_official_split: true

model:
  name: simple_cnn      # simple_cnn | densenet121 | efficientnet_b0 | efficientnet_b3 | resnet18 | resnet50
  # SimpleCNN ignores this for weights - it is always randomly initialised, so
  # this really is a from-scratch baseline. The flag is read by
  # build_transforms(), where true selects ImageNet mean/std normalization
  # instead of 0.5/0.5. Kept true so all three compared models share one input
  # pipeline and the comparison isolates the architecture.
  pretrained: true
  base_width: 32        # simple_cnn only; width of the first conv block
  dropout: 0.3

augmentation:
  # All magnitudes are zero in the reported runs: preprocessing is identical
  # for train, validation and inference, which is what the report claims.
  hflip: 0.0            # OFF: a mirrored chest X-ray is anatomically wrong
  rotation_degrees: 0.0
  translate: 0.0
  scale: [1.0, 1.0]
  brightness: 0.0
  contrast: 0.0
  random_erasing: 0.0

train:
  epochs: 15                  # stopped early at epoch 10 in the reported run
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adamw            # adamw | adam | sgd
  scheduler: plateau          # plateau | cosine | onecycle | none
  scheduler_patience: 2
  loss: weighted_bce          # weighted_bce | bce | focal
  use_class_weights: true     # pos_weight = n_negative / n_positive (train split only)
  monitor: val_roc_auc        # metric used for checkpointing and early stopping
  early_stopping_patience: 5

eval:
  # f1 | youden | min_recall  -- always selected on VALIDATION data only
  threshold_strategy: f1
  min_recall: 0.80            # used only when threshold_strategy: min_recall
  n_bootstrap: 1000           # test-set CIs only; unused in validation-only runs

output:
  root: outputs/classification
