seed: 42
deterministic: true
device: auto
train:
  num_workers: 0
  amp: true
  progress: true
  grad_clip: 1.0
  epochs: 5
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: plateau
  scheduler_patience: 2
  loss: weighted_bce
  use_class_weights: true
  monitor: val_roc_auc
  early_stopping_patience: 2
_config_file: D:\AI Engineering\medicaldiagnostic_finalproject\configs\base.yaml
run_name: xray_finetuned_vit_b16_multilabel_224_stage1_head_only
data:
  root: D:\AI Engineering\medicaldiagnostic_finalproject\data\raw\xray\nih
  layout: csv
  csv_path: D:\AI Engineering\medicaldiagnostic_finalproject\data\processed\xray\train_clean.csv
  image_root: D:\AI Engineering\medicaldiagnostic_finalproject\data\raw\xray\nih\images-small
  image_column: Image
  patient_column: PatientId
  labels:
  - Atelectasis
  - Cardiomegaly
  - Consolidation
  - Edema
  - Effusion
  - Emphysema
  - Fibrosis
  - Hernia
  - Infiltration
  - Mass
  - Nodule
  - Pleural_Thickening
  - Pneumonia
  - Pneumothorax
  unlisted_folders_as_negative: true
  patient_id_regex: null
  image_size: 224
  val_size: 0.15
  test_size: 0.15
  use_official_split: true
model:
  name: vit_b_16
  pretrained: true
  freeze_backbone: true
  vit_unfreeze_last_blocks: 0
  dropout: 0.2
  pretrained_source: torchvision ImageNet weights (weights=DEFAULT -> ViT_B_16_Weights.IMAGENET1K_V1)
    for vit_b_16
  input_preprocessing:
    input: grayscale frontal chest X-ray PNG
    to_rgb: single channel replicated to 3 channels
    resize: direct square resize to 224 x 224 (antialias), no center crop
    normalization_mean:
    - 0.485
    - 0.456
    - 0.406
    normalization_std:
    - 0.229
    - 0.224
    - 0.225
    normalization_source: ImageNet statistics, as required by ViT_B_16_Weights.IMAGENET1K_V1
    train_val_identical: true
    deviation_from_torchvision_preset: torchvision's ViT preset resizes to 256 then
      center-crops to 224; this run resizes directly to 224 to preserve the lung periphery
      and to match the preprocessing convention of the three frozen comparator runs.
augmentation:
  hflip: 0.0
  rotation_degrees: 0.0
  translate: 0.0
  scale:
  - 1.0
  - 1.0
  brightness: 0.0
  contrast: 0.0
  random_erasing: 0.0
vit_stage1_overrides:
  epochs: 5
  lr: 0.001
  early_stopping_patience: 2
eval:
  threshold_strategy: f1
  min_recall: 0.8
  n_bootstrap: 1000
gradcam:
  class_index: 0
  examples_per_group: 2
  alpha: 0.4
output:
  root: D:\AI Engineering\medicaldiagnostic_finalproject\outputs\classification
